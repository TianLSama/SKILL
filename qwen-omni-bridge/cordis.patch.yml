# Qwen 全模态桥接：把音频/视频路由到 qwen3.8-omni-flash。
# 安装为 profile bundle 后，这一行会插入 Host 插件树。
# 这些字段都可以在 DSH 的插件管理页面直接修改；apiKey 留空时读取环境变量。
- insert:
    - id: qwen-omni-bridge
      name: '@local/qwen-omni-bridge'
      config:
        apiKey: ''
        apiKeyEnv: ALIYUN_API_KEY
        baseURL: https://ws-srp61mkj9bp9w0ct.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        model: qwen3.8-omni-flash
        reasoningEffort: low
        autoAnalyzeAttachments: true
